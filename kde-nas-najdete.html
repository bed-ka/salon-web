<!DOCTYPE html>

<head>

<link rel="stylesheet" href="style.css">

<style>

/* TOP LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
}

/* HLAVNÍ KONTEJNER */
.info-section{
    text-align: center;

    padding: 0 25px;
}

/* TEXT */
.info-section p{
    font-size: 18px;
    line-height: 1.9;

    color: #6e5a4a;
}

/* TELEFONY */
.services {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px 0;
}

.service-box {
    flex: 1;
    min-width: 240px;
    padding: 15px;
    background: rgba(255,255,255,0.35);
    border-radius: 16px;
    backdrop-filter: blur(6px);
}

/* MAPA */
iframe {
    margin-top: 25px;
    width: 100%;
    height: 350px;
    border: 0;
    border-radius: 12px;
}

</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">

</div>

<!-- OBSAH -->
<div class="info-section">

    </p>

    <!-- TELEFONY -->

            +420 606 580 435
