<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kde nás najdete | Salon 3MKP</title>

<link rel="stylesheet" href="style.css">

<style>

/* TOP LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
}

/* HLAVNÍ KONTEJNER – jemný kosmetický styl */
.info-section{
    text-align: center;
    max-width: 900px;
    margin: 60px auto;
    padding: 0 25px;
}

/* nadpis */
.info-section h2{
    margin-bottom: 15px;
}

/* text – vzdušnější, elegantnější */
.info-section p{
    font-size: 18px;
    line-height: 1.9;
    margin-bottom: 18px;
    color: #6e5a4a;
}

/* TELEFONY */
.services {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px 0;
}

.service-box {
    flex: 1;
    min-width: 240px;
    padding: 15px;
    background: rgba(255,255,255,0.35);
    border-radius: 16px;
    backdrop-filter: blur(6px);
}

/* MAPA TLAČÍTKO */
.map-button {
    display: inline-block;
    padding: 10px 16px;
    background: #2c3e50;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 500;
    margin-top: 10px;
}

.map-button:hover {
    opacity: 0.9;
}

/* MAPA */
iframe {
    margin-top: 20px;
    width: 100%;
    border:0;
    border-radius:12px;
}

</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
    <a href="index.html" class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/483/483361.png" alt="3MKP logo">
        <h1>3MKP</h1>
    </a>
</div>

<!-- OBSAH -->
<div class="info-section">

    <h2>Kde nás najdete</h2>

    <p>
        Salon 3MKP najdete v klidné lokalitě s dobrou dostupností.
    </p>

    <p>
        <strong>Otevírací doba:</strong><br>
        Po–Pá: dle objednávek
    </p>

    <!-- TELEFONY -->
    <div class="services">

        <div class="service-box">
            <strong>Manikúra – Pedikúra a Solárium</strong><br>
            +420 606 580 435
        </div>

        <div class="service-box">
            <strong>Masáže a Tradiční Čínská Medicína</strong><br>
            +420 775 413 221
        </div>

    </div>

    <p>
        <strong>Adresa:</strong><br>
        Mikulášovice 2, 407 79 Mikulášovice
    </p>

    <a class="map-button"
       href="https://www.google.com/maps?q=Mikulasovice+2+407+79+Czechia&output=embed"
       target="_blank">
       Otevřít v Google Mapách
    </a>

    <iframe
        src="https://www.google.com/maps?q=Mikulasovice+2+407+79+Czechia&output=embed"
        height="350">
    </iframe>

</div>

</body>
</html>
