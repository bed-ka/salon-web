<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon 3MKP</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f1ea;
    overflow-x: hidden;
}

/* HLAVNÍ KONTEJNER */
.hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    padding: 60px 20px;
    gap: 30px;
}

/* STŘED */
.center {
    position: absolute;
    text-align: center;
    z-index: 1;
    max-width: 300px;
}

.center h1 {
    font-size: 40px;
    margin: 0;
    color: #4a3b2f;
}

.center p {
    color: #6b5a4a;
}

/* KARTY */
.card {
    width: 220px;
    height: 180px;
    border-radius: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    text-decoration: none;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    transition: transform 0.3s ease;
    animation: float 6s ease-in-out infinite;
}

/* FLOAT ANIMACE */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

/* BARVY */
.masaze { background: #d9a07a; }
.solarium { background: #7b5ea7; }
.manipedi { background: #4ea8de; }
.tcm { background: #b5651d; }

.extra {
    background: #8d6e63;
    width: 180px;
    height: 120px;
    font-size: 14px;
}

/* HOVER */
.card:hover {
    transform: scale(1.05);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .card {
        width: 160px;
        height: 140px;
        font-size: 14px;
    }

    .center h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="hero">

    <!-- STŘED TEXT -->
    <div class="center">
        <h1>3MKP</h1>
        <p>Místo, kde se propojuje péče o tělo i mysl</p>
    </div>

    <!-- KARTY -->
    <a href="masaze.html" class="card masaze">Masáže</a>

    <a href="solarium.html" class="card solarium">Solárium</a>

    <a href="manipedi.html" class="card manipedi">Mani / Pedi</a>

    <a href="tcm.html" class="card tcm">TCM</a>

    <!-- EXTRA -->
    <a href="kontakt.html" class="card extra">Kde nás najdete</a>

    <a href="darky.html" class="card extra">Dárkové poukazy</a>

</div>

</body>
</html>
