<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3MKP</title>

<style>

/* =======================
   ZÁKLAD
======================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Georgia, serif;
min-height:100vh;
color:#6e5a4a;
overflow-x:hidden;

/* jemné TCM hřejivé pozadí */
background:
radial-gradient(circle at top left, #f3ddc4, transparent 45%),
radial-gradient(circle at top right, #e2b07a, transparent 40%),
radial-gradient(circle at bottom, #f7efe5, #efe2d3);
}

/* =======================
   HERO
======================= */

.hero{
text-align:center;
padding:70px 20px 20px;
}

.hero h1{
font-size:70px;
font-weight:300;
color:#b8873a;
letter-spacing:2px;
}

.hero p{
margin-top:10px;
font-size:20px;
opacity:0.85;
}

/* =======================
   FLOATING GRID
======================= */

.grid{
max-width:1100px;
margin:50px auto;
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:30px;
padding:0 20px;
}

/* levitace */
.card{
position:relative;
height:280px;
border-radius:35px;
overflow:hidden;
text-decoration:none;
box-shadow:0 15px 40px rgba(0,0,0,0.12);
transition:0.4s ease;
animation:float 6s ease-in-out infinite;
}

/* jemné „levitování“ */
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

.card:hover{
transform:translateY(-12px) scale(1.02);
}

/* obrázek */
.card img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(0.95);
}

/* overlay text */
.overlay{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:flex-end;
padding:25px;
background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);
color:white;
}

.overlay h2{
font-size:34px;
font-weight:300;
margin-bottom:5px;
}

.overlay p{
font-size:15px;
opacity:0.9;
}

/* barevné akcenty */
.massage h2{color:#ffd39a;}
.mani h2{color:#d8f0dd;}
.solarium h2{color:#ffc77a;}
.tcm h2{color:#dcc8ff;}
.info h2{color:#f0e0c0;}
.gift h2{color:#f7d9a6;}

/* =======================
   RESPONSIVE
======================= */

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:45px;
}
}

</style>

</head>

<body>

<!-- HERO -->
<div class="hero">
<h1>3MKP</h1>
<p>Místo harmonie těla, mysli a energie</p>
</div>

<!-- GRID -->
<div class="grid">

<a href="#" class="card massage">
<img src="https://images.unsplash.com/photo-1519823551278-64ac92734fb1?q=80&w=1200">
<div class="overlay">
<h2>Masáže</h2>
<p>Uvolnění a regenerace</p>
</div>
</a>

<a href="#" class="card mani">
<img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?q=80&w=1200">
<div class="overlay">
<h2>Mani / Pedi</h2>
<p>Péče o ruce a nohy</p>
</div>
</a>

<a href="#" class="card solarium">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200">
<div class="overlay">
<h2>Solárium</h2>
<p>Teplo a světlo po celý rok</p>
</div>
</a>

<a href="#" class="card tcm">
<img src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?q=80&w=1200">
<div class="overlay">
<h2>TCM</h2>
<p>Rovnováha a energie</p>
</div>
</a>

<a href="#" class="card info">
<img src="https://images.unsplash.com/photo-1520975922203-bb3c0f7d9d3f?q=80&w=1200">
<div class="overlay">
<h2>Kde nás najdete</h2>
<p>Kontakt a adresa</p>
</div>
</a>

<a href="#" class="card gift">
<img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b5d2?q=80&w=1200">
<div class="overlay">
<h2>Dárkové poukazy</h2>
<p>Radost pro blízké</p>
</div>
</a>

</div>

</body>
</html>
