<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3MKP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Georgia, serif;

background:
radial-gradient(circle at top left, #f3ddc4, transparent 40%),
radial-gradient(circle at top right, #e2b07a, transparent 35%),
radial-gradient(circle at bottom, #f7efe5, #efe2d3);

min-height:100vh;
overflow-x:hidden;
color:#6e5a4a;
}

/* ===== CENTRUM ===== */

.center{
text-align:center;
padding-top:60px;
position:relative;
z-index:2;
}

.center h1{
font-size:80px;
font-weight:300;
color:#b8873a;
}

.center p{
font-size:20px;
max-width:500px;
margin:15px auto;
line-height:1.6;
}

/* ===== FLOATING AREA ===== */

.floating-area{
position:relative;
max-width:1000px;
margin:60px auto 40px;
height:520px;
}

/* ===== KARTY ===== */

.card{
position:absolute;
width:240px;
height:240px;
border-radius:35px;
overflow:hidden;
text-decoration:none;
box-shadow:0 25px 50px rgba(0,0,0,0.12);
transition:0.4s;
animation:float 6s ease-in-out infinite;
}

.card:hover{
transform:scale(1.05);
z-index:10;
}

/* jemné „levitování“ */
@keyframes float{
0%{ transform:translateY(0px); }
50%{ transform:translateY(-12px); }
100%{ transform:translateY(0px); }
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

/* text overlay */
.overlay{
position:absolute;
bottom:0;
left:0;
right:0;
padding:18px;
background:linear-gradient(to top, rgba(0,0,0,0.45), transparent);
color:white;
}

.overlay h3{
font-size:28px;
font-weight:300;
}

/* ===== ROZLOŽENÍ KARET (LEHKÉ „ORBIT“ POZICE) ===== */

.massage{
top:0;
left:10%;
}

.mani{
top:40px;
right:8%;
}

.solarium{
bottom:0;
left:15%;
}

.tcm{
bottom:20px;
right:12%;
}

/* ===== DOLNÍ DVOJICE ===== */

.bottom{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin:40px auto 60px;
}

.small{
background:rgba(255,255,255,0.55);
backdrop-filter:blur(10px);
padding:20px 25px;
border-radius:25px;
width:220px;
text-decoration:none;
color:#6e5a4a;
box-shadow:0 10px 25px rgba(0,0,0,0.06);
transition:0.3s;
}

.small:hover{
transform:translateY(-5px);
}

.small h4{
font-size:22px;
font-weight:400;
margin-bottom:5px;
}

/* ===== RESPONSIVE ===== */

@media(max-width:768px){

.center h1{
font-size:50px;
}

.floating-area{
height:auto;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:0 20px;
}

.card{
position:relative;
width:100%;
max-width:320px;
height:220px;
animation:none;
}

}

</style>
</head>

<body>

<div class="center">
<h1>3MKP</h1>
<p>
Místo pro harmonii těla, mysli a energie.<br>
Tradiční péče v moderním pojetí.
</p>
</div>

<div class="floating-area">

<a href="#" class="card massage">
<img src="https://images.unsplash.com/photo-1519823551278-64ac92734fb1?q=80&w=1200">
<div class="overlay"><h3>Masáže</h3></div>
</a>

<a href="#" class="card mani">
<img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?q=80&w=1200">
<div class="overlay"><h3>Mani / Pedi</h3></div>
</a>

<a href="#" class="card solarium">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200">
<div class="overlay"><h3>Solárium</h3></div>
</a>

<a href="#" class="card tcm">
<img src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?q=80&w=1200">
<div class="overlay"><h3>TCM</h3></div>
</a>

</div>

<div class="bottom">

<a class="small" href="#">
<h4>Kde nás najdete</h4>
<p>Adresa a kontakt</p>
</a>

<a class="small" href="#">
<h4>Poukazy</h4>
<p>Dárky pro blízké</p>
</a>

</div>

</body>
</html>
