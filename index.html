<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3MKP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Georgia, serif;

/* jemné hřejivé pozadí */
background:
radial-gradient(circle at top left, #f3ddc4, transparent 40%),
radial-gradient(circle at top right, #e2b07a, transparent 35%),
radial-gradient(circle at bottom, #f7efe5, #efe2d3);

min-height:100vh;
color:#6e5a4a;
overflow-x:hidden;
}

/* ===== TOP BAR ===== */

.topbar{
height:85px;
display:flex;
align-items:center;
padding-left:40px;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.3);
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo img{
width:50px;
height:50px;
border-radius:50%;
}

.logo h1{
font-size:42px;
font-weight:300;
color:#c79a4a;
}

/* ===== HERO TEXT ===== */

.hero{
text-align:center;
padding:50px 20px 30px;
}

.hero h2{
font-size:80px;
font-weight:300;
color:#b8873a;
margin-bottom:10px;
}

.hero p{
font-size:22px;
max-width:600px;
margin:0 auto;
line-height:1.6;
}

/* ===== GRID ===== */

.grid{
max-width:1200px;
margin:40px auto;
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:35px;
padding:0 20px;
}

/* ===== CARD ===== */

.card{
height:320px;
border-radius:40px;
overflow:hidden;
position:relative;
text-decoration:none;
box-shadow:0 20px 40px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
}

/* obrázek */
.card img{
width:100%;
height:100%;
object-fit:cover;
}

/* text NA OBRÁZKU */
.overlay{
position:absolute;
bottom:0;
left:0;
right:0;
padding:25px;
background:linear-gradient(to top, rgba(0,0,0,0.45), transparent);
color:white;
}

.overlay h3{
font-size:42px;
font-weight:300;
margin-bottom:5px;
}

.overlay p{
font-size:18px;
line-height:1.4;
max-width:300px;
}

/* barevné akcenty */
.massage h3{ color:#ffd39a; }
.mani h3{ color:#d8f0dd; }
.solarium h3{ color:#ffc77a; }
.tcm h3{ color:#dcc8ff; }

/* ===== MALÉ KARTY ===== */

.bottom{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
margin:50px auto;
padding:0 20px;
max-width:900px;
}

.small{
background:rgba(255,255,255,0.6);
padding:25px;
border-radius:30px;
width:260px;
backdrop-filter:blur(10px);
box-shadow:0 10px 25px rgba(0,0,0,0.05);
text-decoration:none;
color:#6e5a4a;
transition:0.3s;
}

.small:hover{
transform:translateY(-5px);
}

.small h4{
font-size:26px;
margin-bottom:10px;
font-weight:400;
}

/* ===== RESPONSIVE ===== */

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}

.hero h2{
font-size:55px;
}
}

</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
<div class="logo">
<img src="https://cdn-icons-png.flaticon.com/512/483/483361.png">
<h1>3MKP</h1>
</div>
</div>

<!-- HERO -->
<div class="hero">
<h2>3MKP</h2>
<p>
Místo pro harmonii těla, mysli a energie.
Tradiční péče v moderním pojetí.
</p>
</div>

<!-- GRID -->
<div class="grid">

<a href="#" class="card massage">
<img src="https://images.unsplash.com/photo-1519823551278-64ac92734fb1?q=80&w=1200">
<div class="overlay">
<h3>Masáže</h3>
<p>Uvolnění, regenerace a klid.</p>
</div>
</a>

<a href="#" class="card mani">
<img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?q=80&w=1200">
<div class="overlay">
<h3>Mani / Pedi</h3>
<p>Péče o ruce a nohy.</p>
</div>
</a>

<a href="#" class="card solarium">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200">
<div class="overlay">
<h3>Solárium</h3>
<p>Slunce kdykoliv potřebuješ.</p>
</div>
</a>

<a href="#" class="card tcm">
<img src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?q=80&w=1200">
<div class="overlay">
<h3>TCM</h3>
<p>Rovnováha a energie.</p>
</div>
</a>

</div>

<!-- DOLNÍ MENU -->
<div class="bottom">

<a class="small" href="#">
<h4>Kde nás najdete</h4>
<p>Adresa a kontakt</p>
</a>

<a class="small" href="#">
<h4>Poukazy</h4>
<p>Dárky pro blízké</p>
</a>

</div>

</body>
</html>
